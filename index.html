
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夺宝奇兵：大冒险</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow: hidden;
        }
        .adventure-font {
            font-family: 'Cinzel', serif;
        }
        /* 强化版羊皮纸质感 */
        .map-texture {
            background-color: #d4bc8f;
            background-image: 
                url("https://www.transparenttextures.com/patterns/paper-fibers.png"),
                radial-gradient(circleAtCenter, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 80%),
                url("https://www.transparenttextures.com/patterns/parchment.png");
            box-shadow: 
                inset 0 0 150px rgba(78, 54, 34, 0.4),
                0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        /* 模拟纸张褶皱 */
        .map-texture::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.05) 50%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .tile-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }
        .compass-rose {
            position: absolute;
            width: 400px;
            height: 400px;
            opacity: 0.1;
            bottom: -50px;
            right: -50px;
            pointer-events: none;
            z-index: 0;
            transform: rotate(-15deg);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
